# One place for every dependency and tool version of the build (docs/technical-debt.md TD-13). Dependabot (.github/dependabot.yml) proposes updates to this file.

[versions]
junit = "6.1.3"
joml = "1.10.9"
japicmp = "0.26.2"
jacoco = "0.8.15"
pitest = "1.30.0"
pitest-junit5 = "1.2.3"
jmh = "1.37"

[libraries]
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
joml = { module = "org.joml:joml", version.ref = "joml" }
japicmp = { module = "com.github.siom79.japicmp:japicmp", version.ref = "japicmp" }
pitest-command-line = { module = "org.pitest:pitest-command-line", version.ref = "pitest" }
pitest-junit5-plugin = { module = "org.pitest:pitest-junit5-plugin", version.ref = "pitest-junit5" }
jmh-core = { module = "org.openjdk.jmh:jmh-core", version.ref = "jmh" }
jmh-generator-annprocess = { module = "org.openjdk.jmh:jmh-generator-annprocess", version.ref = "jmh" }
