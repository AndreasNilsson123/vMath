name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  schedule:
    - cron: "0 3 * * *"   # nightly: fresh random seed, many more trials

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history and tags: japicmp needs the baseline tag
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Install glslang (ShaderCompileTest compiles the generated GLSL; it is skipped without a compiler)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y glslang-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test (fixed seed)
        if: github.event_name != 'schedule'
        run: ./gradlew build
      - name: Build and test (nightly seed)
        if: github.event_name == 'schedule'
        shell: bash
        run: ./gradlew build -Dvmath.seed=$(date +%s) -Dvmath.trials=20000

  valhalla:
    # Early-access JDK with JEP 401 value classes. Allowed to fail until the preview stabilizes.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history and tags: japicmp needs the baseline tag
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            28-ea
            25
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_28_X64 build -Pvalhalla
