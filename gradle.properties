# JDK versions for every module (docs/technical-debt.md TD-14): the build and the published class files use vmath.jdk; -Pvalhalla switches to the early-access vmath.valhallaJdk.
vmath.jdk=25
vmath.valhallaJdk=28

# the build is configuration-cache safe (docs/technical-debt.md TD-14); no local script object is captured by a task
org.gradle.configuration-cache=true
